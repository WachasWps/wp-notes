<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light dark">
<title>Notes</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;--acc:#2f4db0;--green:#117a4d;--greenbg:#e3f6ec;--amber:#9a5b00;--amberbg:#fff1d6;--red:#b42318;--redbg:#fde7e4;--blue:#1d4ed8;--bluebg:#e4ecff;--gray:#475467;--graybg:#eceff3;--purple:#6d28d9;--purplebg:#efe7ff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#eceff4;--mute:#97a0af;--line:#272d37;--acc:#8ea8ff;--green:#5bd39b;--greenbg:#12301f;--amber:#f5c26b;--amberbg:#352712;--red:#ff8f85;--redbg:#3a1a17;--blue:#8fb0ff;--bluebg:#17284f;--gray:#b6bdc9;--graybg:#232933;--purple:#c4a8ff;--purplebg:#2a1f4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
#lock{max-width:360px;margin:18vh auto 0;padding:0 20px;text-align:center}
#lock input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#lock button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:600}
@media(prefers-color-scheme:dark){#lock button{color:#0e1116}}
#lock label{display:block;margin-top:12px;color:var(--mute);font-size:13px}
#err{color:var(--red);min-height:20px;margin-top:10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11px;color:var(--mute)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:20px 2px 8px;font-weight:600}
.todo{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.todo div{display:flex;gap:10px;padding:11px 12px;border-top:1px solid var(--line);align-items:flex-start}
.todo div:first-child{border-top:0}
.todo .when{flex:none;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:var(--graybg);color:var(--gray);margin-top:1px}
.todo .p1 .when{background:var(--redbg);color:var(--red)}
.todo .p2 .when{background:var(--amberbg);color:var(--amber)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.chip.on{color:#0e1116}}
input[type=search]{width:100%;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.co{font-weight:700;font-size:16px}
.role{color:var(--mute);font-size:13.5px}
.badge{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-call{background:var(--purplebg);color:var(--purple)}.b-talk{background:var(--greenbg);color:var(--green)}.b-action{background:var(--redbg);color:var(--red)}
.b-applied{background:var(--bluebg);color:var(--blue)}.b-emailed{background:var(--bluebg);color:var(--blue)}.b-prepared{background:var(--amberbg);color:var(--amber)}
.b-hold,.b-closed{background:var(--graybg);color:var(--gray)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--mute);font-size:12.5px;margin-top:6px}
.line{margin-top:8px;font-size:14px}
.line b{font-weight:600}
.next{margin-top:6px;font-size:13.5px;color:var(--acc)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns a{font-size:13px;text-decoration:none;color:var(--acc);border:1px solid var(--line);padding:7px 11px;border-radius:10px}
.note{margin-top:8px;font-size:13px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.foot{color:var(--mute);font-size:12px;text-align:center;margin-top:22px}
.mtab{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.mrow{display:grid;grid-template-columns:1fr 62px 50px;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;font-size:14px}.mrow:first-child{border-top:0}.mrow.h{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}.mrow .rate{text-align:right;font-weight:700}.mrow .bar{grid-column:1/-1;height:5px;background:var(--graybg);border-radius:9px;overflow:hidden;margin-top:-2px}.mrow .bar i{display:block;height:100%;background:var(--acc)}.mrow.top .rate{color:var(--green)}.tip{font-size:13px;color:var(--mute);margin:8px 2px 0}
</style>
</head>
<body>
<div id="lock">
  <h1>Notes</h1>
  <div class="sub">Enter your password</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="password" autofocus>
  <button id="go">Unlock</button>
  <label><input id="rem" type="checkbox" checked> Remember on this device</label>
  <div id="err"></div>
</div>
<div id="app" class="wrap" hidden></div>

const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.iv)}, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(pass, silent){
  try{
    const data = await decrypt(pass);
    if($('#rem').checked){ try{ localStorage.setItem('np', pass); }catch(e){} }
    $('#lock').hidden = true; $('#app').hidden = false; render(data);
  }catch(e){
    if(!silent) $('#err').textContent = 'Wrong password';
    try{ if(silent) localStorage.removeItem('np'); }catch(_){}
  }
}
$('#go').onclick = () => unlock($('#pw').value.trim(), false);
$('#pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('#go').click(); });
try{ const saved = localStorage.getItem('np'); if(saved) unlock(saved, true); }catch(e){}

const LABEL = {call:'Call booked', talk:'In talks', action:'Reply needed', applied:'Applied', emailed:'Emailed', prepared:'Ready to apply', hold:'On hold', closed:'Closed'};
const ORDER = ['call','action','talk','prepared','applied','emailed','hold','closed'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe = u => /^(https?:|mailto:)/i.test(u) ? u : '';
function render(data){
  const J = data.jobs;
  const n = k => J.filter(j => j.st === k).length;
  const sent = J.filter(j => ['applied','emailed','call','talk','action','closed'].includes(j.st)).length;
  const replies = J.filter(j => ['call','talk','action'].includes(j.st)).length + J.filter(j => j.st === 'closed' && /^replied/i.test(j.resp)).length;
  let filter = 'all', q = '';
  const app = $('#app');
  app.innerHTML = `
    <h1>Job hunt</h1><div class="sub">Updated ${esc(data.updated)}</div>
    <div class="stats">
      <div class="stat"><b>${sent}</b><span>contacted</span></div>
      <div class="stat"><b>${replies}</b><span>responses</span></div>
      <div class="stat"><b>${n('call')}</b><span>calls booked</span></div>
      <div class="stat"><b>${n('prepared')}</b><span>ready to apply</span></div>
    </div>
    <div class="sec">Do next</div>
    <div class="todo">${data.todo.map(t => `<div class="p${t.pri}"><span class="when">${esc(t.d)}</span><span>${esc(t.t)}</span></div>`).join('')}</div>
    <div class="sec">What is working</div>
    <div id="work"></div>
    <div class="sec">All jobs</div>
    <input type="search" id="q" placeholder="Search company, role, city">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <div class="foot">Private notes. Only you have the password.</div>`;
  const isRep = j => ['call','talk','action'].includes(j.st) || (j.st==='closed' && /^replied/i.test(j.resp||''));
  const sentRows = J.filter(j => !['prepared','hold'].includes(j.st));
  function table(key, title){
    const g = {};
    sentRows.forEach(j => { const k = j[key] || 'Other'; (g[k] = g[k] || [0,0]); g[k][0]++; if(isRep(j)) g[k][1]++; });
    const rows = Object.entries(g).sort((a,b) => (b[1][1]/b[1][0]) - (a[1][1]/a[1][0]) || b[1][0]-a[1][0]);
    const best = rows.find(r => r[1][0] >= 5 && r[1][1] > 0);
    return `<div class="mtab"><div class="mrow h"><span>${title}</span><span>Replies</span><span style="text-align:right">Rate</span></div>` +
      rows.map(([k,[t,r]]) => { const pct = Math.round(100*r/t); return `<div class="mrow${best && best[0]===k?' top':''}"><span>${esc(k)}</span><span>${r} of ${t}</span><span class="rate">${pct}%</span><div class="bar"><i style="width:${Math.min(100,pct*3)}%"></i></div></div>`; }).join('') + '</div>';
  }
  $('#work').innerHTML = table('m','How I contacted') + '<div style="height:10px"></div>' + table('s','Where I found it') + '<div class="tip">A reply means a person answered (call, chat, or a request for details). Automated rejections do not count. Do more of the top rows.</div>';
  
  const chips = [['all','All ('+J.length+')'],['resp','Responses'],['call','Calls'],['prepared','Ready to apply'],['applied','Applied'],['emailed','Emailed'],['hold','On hold'],['closed','Closed']];
  $('#chips').innerHTML = chips.map(c => `<button class="chip${c[0]===filter?' on':''}" data-f="${c[0]}">${c[1]}</button>`).join('');
  function draw(){
    document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
    let rows = J.filter(j => filter==='all' ? true : filter==='resp' ? ['call','talk','action'].includes(j.st) : j.st === filter);
    if(q){ const s = q.toLowerCase(); rows = rows.filter(j => (j.c+' '+j.r+' '+j.loc+' '+j.via).toLowerCase().includes(s)); }
    rows.sort((a,b) => ORDER.indexOf(a.st) - ORDER.indexOf(b.st));
    $('#list').innerHTML = rows.length ? rows.map(j => {
      const src = safe(j.src), ap = safe(j.apply);
      return `<div class="card">
        <div class="top"><div><div class="co">${esc(j.c)}</div><div class="role">${esc(j.r)}</div></div><span class="badge b-${j.st}">${LABEL[j.st]}</span></div>
        <div class="meta"><span>${esc(j.loc)}</span><span>${j.d ? 'Sent ' + esc(j.d.slice(5)) : ''}</span><span>${esc(j.t === 'cold' ? 'Cold email' : j.t === 'recruiter' ? 'Via recruiter' : 'Job portal')}</span></div>
        ${j.resp ? `<div class="line"><b>Response:</b> ${esc(j.resp)}</div>` : ''}
        ${j.nxt ? `<div class="next">Next: ${esc(j.nxt)}${j.nd ? ' (' + esc(j.nd.slice(5)) + ')' : ''}</div>` : ''}
        ${j.note ? `<div class="note">${esc(j.note)}</div>` : ''}
        <div class="note">Found via: ${esc(j.via)}</div>
        <div class="btns">${src ? `<a href="${esc(src)}" target="_blank" rel="noopener noreferrer">Source link</a>` : ''}${ap && ap !== src ? `<a href="${esc(ap)}" target="_blank" rel="noopener noreferrer">${ap.startsWith('mailto') ? 'Email' : 'Apply page'}</a>` : ''}</div>
      </div>`; }).join('') : '<div class="empty">Nothing here</div>';
  }
  $('#chips').onclick = e => { const b = e.target.closest('.chip'); if(b){ filter = b.dataset.f; draw(); } };
  $('#q').oninput = e => { q = e.target.value.trim(); draw(); };
  draw();
}
</script>
